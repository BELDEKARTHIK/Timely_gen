name: flutter_local_notifications_windows
description: No-op stub — avoids NuGet requirement on Windows builds.
version: 0.0.1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      windows:
        dartPluginClass: FlutterLocalNotificationsWindowsStub
        fileName: flutter_local_notifications_windows.dart
